# Netlify configuration - deploys the Next.js frontend only.
# The NestJS API must be hosted separately (Render, Railway, Fly.io, etc.)

[build]
  # Builds @bm/shared first, then @bm/web (the trailing ... includes workspace dependencies)
  command = "npx turbo run build --filter=@bm/web..."
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  TURBO_TELEMETRY_DISABLED = "1"
  NEXT_TELEMETRY_DISABLED = "1"

# Required for Next.js SSR/API routes support on Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
